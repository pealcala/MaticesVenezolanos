<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repertorio - Matices Venezolanos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    .youtube-tool-btn {
      background-color: #c41e3a;
      color: #ffffff;
      border: 1px solid #9e142b;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .youtube-tool-btn:hover {
      background-color: #a0142c;
      color: #ffffff;
      border-color: #7d0e21;
      transform: translateY(-1px);
    }
    .youtube-tool-btn.disabled {
      background-color: #e6dac3;
      color: var(--text-muted);
      border-color: var(--border-warm);
      cursor: default;
      pointer-events: none;
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <header id="appHeader"></header>

  <div class="app-container">
    <aside id="sidebar"></aside>

    <main class="content-panel" id="mainPanel">
      <div class="section-header">
        <div>
          <h2 class="section-title"><i data-lucide="music-2"></i> Repertorio</h2>
          <p class="section-subtitle">Explora las tonalidades, contexto y letras</p>
        </div>
      </div>

      <div class="songs-toolbar">
        <div class="search-box">
          <i data-lucide="search"></i>
          <input type="text" id="songSearchInput" placeholder="Buscar por título, tonalidad o letra..." oninput="filterSongs()">
        </div>
        <div id="songsCountBadge" class="tone-badge">
          7 Obras
        </div>
      </div>

      <div class="songs-grid" id="songsContainer"></div>
    </main>
  </div>

  <!-- MODAL DE DETALLE / LETRA -->
  <div class="modal-overlay" id="lyricsModal" onclick="closeLyricsModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div>
          <h3 class="modal-song-title" id="modalTitle">Título Canción</h3>
          <span id="modalToneBadge" class="tone-badge" style="display: inline-flex; margin-top: 6px;">Tono: -</span>
        </div>
        <button class="modal-close-btn" onclick="closeLyricsModal()">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="modal-toolbar">
        <div class="tool-group">
          <button class="modal-tool-btn" onclick="changeFontSize(-1)" title="Reducir fuente">A-</button>
          <button class="modal-tool-btn" onclick="changeFontSize(1)" title="Aumentar fuente">A+</button>
          <span id="modalYoutubeContainer"></span>
        </div>
        <div class="tool-group">
          <button class="modal-tool-btn" id="autoScrollBtn" onclick="toggleAutoScroll()">
            <i data-lucide="arrow-down-circle"></i> Desplazamiento
          </button>
        </div>
      </div>

      <div class="modal-lyrics-body" id="modalLyricsText"></div>
    </div>
  </div>

  <script src="js/layout.js"></script>

    document.addEventListener("DOMContentLoaded", () => {
      initLayout("repertorio", "Repertorio Musical");
      renderRepertorio(repertorioData);
    });

    function renderRepertorio(list) {
      const container = document.getElementById("songsContainer");
      container.innerHTML = "";

      list.forEach(item => {
        const card = document.createElement("div");
        card.className = "song-card";
        card.onclick = () => openSongModal(item);

        card.innerHTML = `
          <div class="song-card-header">
            <h3 class="song-title">${item.titulo}</h3>
            <span class="tone-badge"><i data-lucide="music-4" style="width:14px;height:14px;"></i> ${item.tono}</span>
          </div>
          <p class="song-snippet">"${item.cita}"</p>
          <div class="song-btn-view">
            <i data-lucide="book-open" style="width: 16px; height: 16px;"></i> Ver Letra y Detalle
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById("songsCountBadge").innerHTML = `<i data-lucide="list-music" style="width:14px;height:14px;"></i> ${list.length} Obras`;
      lucide.createIcons();
    }

    function filterSongs() {
      const query = document.getElementById("songSearchInput").value.toLowerCase();
      const filtered = repertorioData.filter(s => 
        s.titulo.toLowerCase().includes(query) || 
        s.cita.toLowerCase().includes(query) ||
        s.descripcion.toLowerCase().includes(query) ||
        s.tono.toLowerCase().includes(query)
      );
      renderRepertorio(filtered);
    }

    function openSongModal(item) {
      document.getElementById("modalTitle").innerText = item.titulo;
      document.getElementById("modalToneBadge").innerHTML = `<i data-lucide="music-4" style="width:14px;height:14px;"></i> Tono: ${item.tono}`;
      
      const ytContainer = document.getElementById("modalYoutubeContainer");
      if (item.youtube) {
        ytContainer.innerHTML = `
          <a href="${item.youtube}" target="_blank" rel="noopener noreferrer" class="modal-tool-btn youtube-tool-btn" title="Ver video en YouTube">
            <i data-lucide="youtube" style="width: 16px; height: 16px;"></i> YouTube
          </a>
        `;
      } else {
        ytContainer.innerHTML = `
          <span class="modal-tool-btn youtube-tool-btn disabled" title="Video en preparación">
            <i data-lucide="youtube" style="width: 16px; height: 16px;"></i> Próximamente…
          </span>
        `;
      }

      const modalBody = document.getElementById("modalLyricsText");
      modalBody.style.whiteSpace = "normal";
      modalBody.innerHTML = `
        <div style="margin-bottom: 1.25rem; background: #eee1c7; padding: 1.25rem; border-left: 4px solid var(--vinotinto-accent); border-radius: 0 12px 12px 0;">
          <p style="font-style: italic; white-space: pre-line; margin-bottom: 0.5rem;">${item.cita}</p>
          <small style="color: var(--vinotinto-accent); font-weight: 700;">— ${item.autor}</small>
        </div>
        <p style="margin-bottom: 1.25rem; line-height: 1.85;">
          <strong>Reseña e Historia:</strong><br>
          ${item.descripcion}
        </p>
      `;
      modalBody.style.fontSize = `${currentFontSize}rem`;
      modalBody.scrollTop = 0;

      stopAutoScroll();
      document.getElementById("lyricsModal").classList.add("open");
      lucide.createIcons();
    }
  </script>
</body>
</html>
