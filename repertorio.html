Y si usted lo duda, pues venga a el y ponga atención.`
          }
        ]
      },
      {
        id: "la-pulga-y-el-piojo",
        titulo: "La Pulga y El Piojo",
        tono: "S/T",
        genero: "Merengue venezolano",
        generoClase: "genre-merengue",
        youtube: "https://youtu.be/l5pmqxjXZHo?si=KivC0I40vn-7oPkH",
        cita: `La pulga y el piojo se quieren casar, pero no se casan por falta de pan
Respondió el Gorgojo desde su trigal: "Hágase la boda que yo doy el pan"

Ya no es por el pan que ya lo tenemos,
ahora es quien baile, ¿dónde lo hallaremos?
Respondió la Vaca desde su corral:
"Mmmm, hágase la boda que yo iré a bailar"

Ya no es por el baile que ya lo tenemos,
Ahora es quien cante, ¿dónde lo hallaremos?
Respondió la Rana desde el platanal:
"Hágase la boda que yo iré a cantar"

Ya no es por el canto que ya lo tenemos,
Ahora es quien coma, ¿dónde lo hallaremos?
Exclamó el Zamuro, que buen paladar:
"Je, je, hágase la boda que yo iré a almorzar"

Ya no es quien almuerce que ya lo tenemos,
Falta quien trabaje ¿dónde lo hallaremos?
Saltó la Pereza del algarrobal:
"Hágase la boda, que yo iré a trabajar"

Ya no es quien trabaje, que ya lo tenemos,
Ahora es la luz, ¿dónde la hallaremos?
Respondió el Cocuyo desde el chamizal:
"Hágase la boda, que yo iré a alumbrar"

Ya no es por la luz, que ya lo tenemos
Ahora es el perfume ¿dónde lo hallaremos?
Salió el Mapurite desde el matorral:
"Hágase la boda que yo iré a perfumar"

Ya no es el perfume que ya lo tenemos,
Ahora es el Padrino ¿dónde lo hallaremos?
Gritó el Ratoncito: "¡Me importa un comino!
Bueno, si encierran la Gata, yo soy el Padrino"

Ya no es el Padrino que ya lo tenemos,
Ahora es la Madrina, ¿dónde la hallaremos?
Respondió la Gata desde la cocina:
"Hágase la boda, yo soy la Madrina"

Todos se durmieron por el ron y el vino,
Entonces la Gata ¡MIAAAUUU! ¡Se comió al padrino!`,
        autor: "Iván Pérez Rossi (Serenata Guayanesa)",
        descripcion: "Emblemática canción humorística y narrativa del repertorio infantil y popular venezolano en ritmo de merengue, donde diversos animales del campo se ofrecen para celebrar la boda de la pulga y el piojo hasta un desenlace inesperado."
      }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      initLayout("repertorio", "Repertorio Musical");
      renderRepertorio(repertorioData);
    });

    function renderRepertorio(list) {
      const container = document.getElementById("songsContainer");
      container.innerHTML = "";

      list.forEach(item => {
        const card = document.createElement("div");
        card.className = "song-card";
        card.onclick = () => openSongModal(item);

        const toneDisplay = item.tono && item.tono !== "S/T"
          ? `<span class="tone-badge"><i data-lucide="music-4" style="width:14px;height:14px;"></i> ${item.tono}</span>`
          : `<span class="tone-badge"><i data-lucide="music-4" style="width:14px;height:14px;"></i> Tradicional</span>`;

        const genreDisplay = item.genero
          ? `<span class="genre-badge ${item.generoClase}"><i data-lucide="disc-3" style="width:13px;height:13px;"></i> ${item.genero}</span>`
          : "";

        card.innerHTML = `
          <div class="song-card-header">
            <h3 class="song-title">${item.titulo}</h3>
            ${toneDisplay}
          </div>
          ${genreDisplay}
          <p class="song-snippet">"${item.cita}"</p>
          <div class="song-btn-view">
            <i data-lucide="book-open" style="width: 16px; height: 16px;"></i> Ver Letra y Detalle
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById("songsCountBadge").innerHTML = `<i data-lucide="list-music" style="width:14px;height:14px;"></i> ${list.length} Obras`;
      lucide.createIcons();
    }

    function filterSongs() {
      const query = document.getElementById("songSearchInput").value.toLowerCase();
      const filtered = repertorioData.filter(s => {
        const inTitle = s.titulo.toLowerCase().includes(query);
        const inGenre = s.genero ? s.genero.toLowerCase().includes(query) : false;
        const inCita = s.cita.toLowerCase().includes(query);
        const inDesc = s.descripcion.toLowerCase().includes(query);
        const inTone = s.tono.toLowerCase().includes(query);
        const inPartes = s.partes ? s.partes.some(p => p.subtitulo.toLowerCase().includes(query) || p.letra.toLowerCase().includes(query)) : false;
        return inTitle || inGenre || inCita || inDesc || inTone || inPartes;
      });
      renderRepertorio(filtered);
    }

    function openSongModal(item) {
      document.getElementById("modalTitle").innerText = item.titulo;
      
      const badgeEl = document.getElementById("modalToneBadge");
      if (item.tono && item.tono !== "S/T") {
        badgeEl.style.display = "inline-flex";
        badgeEl.innerHTML = `<i data-lucide="music-4" style="width:14px;height:14px;"></i> Tono: ${item.tono}`;
      } else {
        badgeEl.style.display = "inline-flex";
        badgeEl.innerHTML = `<i data-lucide="music-4" style="width:14px;height:14px;"></i> Música Tradicional`;
      }

      const genreEl = document.getElementById("modalGenreBadge");
      if (item.genero) {
        genreEl.style.display = "inline-flex";
        genreEl.className = `genre-badge ${item.generoClase}`;
        genreEl.innerHTML = `<i data-lucide="disc-3" style="width:13px;height:13px;"></i> ${item.genero}`;
      } else {
        genreEl.style.display = "none";
      }
      
      const ytContainer = document.getElementById("modalYoutubeContainer");
      if (item.esPopurri) {
        ytContainer.innerHTML = `
          <span class="modal-tool-btn youtube-tool-btn disabled" title="Cada tema del popurrí tiene su propio video abajo">
            <i data-lucide="youtube" style="width: 16px; height: 16px;"></i> 4 Enlaces abajo
          </span>
        `;
      } else if (item.youtube) {
        ytContainer.innerHTML = `
          <a href="${item.youtube}" target="_blank" rel="noopener noreferrer" class="modal-tool-btn youtube-tool-btn" title="Ver video en YouTube">
            <i data-lucide="youtube" style="width: 16px; height: 16px;"></i> YouTube
          </a>
        `;
      } else {
        ytContainer.innerHTML = `
          <span class="modal-tool-btn youtube-tool-btn disabled" title="Video en preparación">
            <i data-lucide="youtube" style="width: 16px; height: 16px;"></i> Próximamente…
          </span>
        `;
      }

      const modalBody = document.getElementById("modalLyricsText");
      modalBody.style.whiteSpace = "normal";

      if (item.esPopurri && item.partes) {
        let partesHtml = item.partes.map(parte => `
          <div class="calipso-section">
            <div class="calipso-section-header">
              <div>
                <div class="calipso-song-title">${parte.subtitulo}</div>
                <span class="calipso-song-author">— ${parte.autor}</span>
              </div>
              <a href="${parte.youtube}" target="_blank" rel="noopener noreferrer" class="yt-inline-link" title="Ver ${parte.subtitulo} en YouTube">
                <i data-lucide="youtube" style="width: 15px; height: 15px;"></i> Ver en YouTube
              </a>
            </div>
            <p style="font-style: italic; white-space: pre-line; line-height: 1.8;">${parte.letra}</p>
          </div>
        `).join("");

        modalBody.innerHTML = `
          ${partesHtml}
          <p style="margin-bottom: 1.25rem; line-height: 1.85;">
            <strong>Reseña e Historia:</strong><br>
            ${item.descripcion}
          </p>
        `;
      } else {
        modalBody.innerHTML = `
          <div style="margin-bottom: 1.25rem; background: #eee1c7; padding: 1.25rem; border-left: 4px solid var(--vinotinto-accent); border-radius: 0 12px 12px 0;">
            <p style="font-style: italic; white-space: pre-line; margin-bottom: 0.5rem;">${item.cita}</p>
            <small style="color: var(--vinotinto-accent); font-weight: 700;">— ${item.autor}</small>
          </div>
          <p style="margin-bottom: 1.25rem; line-height: 1.85;">
            <strong>Reseña e Historia:</strong><br>
            ${item.descripcion}
          </p>
        `;
      }

      modalBody.style.fontSize = `${currentFontSize}rem`;
      modalBody.scrollTop = 0;

      stopAutoScroll();
      document.getElementById("lyricsModal").classList.add("open");
      lucide.createIcons();
    }
  </script>
</body>
</html>
