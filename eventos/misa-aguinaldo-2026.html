<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misa de Aguinaldo 2026 - Matices Venezolanos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

  <header id="appHeader"></header>

  <div class="app-container">
    <aside id="sidebar"></aside>

    <main class="content-panel" id="mainPanel">
      <div class="section-header">
        <div>
          <h2 class="section-title"><i data-lucide="church"></i> Misa de Aguinaldo 2026</h2>
          <p class="section-subtitle">Parroquia Sagrada Familia • Orden Litúrgico y Letras Completas</p>
        </div>
        <div class="toolbar-actions">
          <button class="btn-mode-toggle active-mode" id="btnMassGridView" onclick="switchMassViewMode('grid')">
            <i data-lucide="layout-grid" style="width:16px;height:16px;"></i> Tarjetas
          </button>
          <button class="btn-mode-toggle" id="btnMassListView" onclick="switchMassViewMode('full')">
            <i data-lucide="scroll-text" style="width:16px;height:16px;"></i> Guion Continuo
          </button>
        </div>
      </div>

      <div class="songs-toolbar">
        <div class="search-box">
          <i data-lucide="search"></i>
          <input type="text" id="massSearchInput" placeholder="Buscar por momento litúrgico, canto, tono o letra..." oninput="filterMassSongs()">
        </div>
        <div id="massCountBadge" class="tone-badge">
          <i data-lucide="list-music" style="width:14px;height:14px;"></i> 11 Cantos
        </div>
      </div>

      <div class="songs-grid" id="massSongsContainer"></div>
      <div class="full-mass-container" id="fullMassContainer"></div>
    </main>
  </div>

  <!-- MODAL DE LETRA COMPLETA -->
  <div class="modal-overlay" id="lyricsModal" onclick="closeLyricsModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div>
          <div class="modal-moment-label" id="modalMoment" style="display: block;">Momento Litúrgico</div>
          <h3 class="modal-song-title" id="modalTitle">Título Canción</h3>
          <span id="modalToneBadge" class="tone-badge" style="display: inline-flex; margin-top: 6px;">Tono: -</span>
        </div>
        <button class="modal-close-btn" onclick="closeLyricsModal()">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="modal-toolbar">
        <div class="tool-group">
          <button class="modal-tool-btn" onclick="changeFontSize(-1)" title="Reducir fuente">A-</button>
          <button class="modal-tool-btn" onclick="changeFontSize(1)" title="Aumentar fuente">A+</button>
        </div>
        <div class="tool-group">
          <button class="modal-tool-btn" id="autoScrollBtn" onclick="toggleAutoScroll()">
            <i data-lucide="arrow-down-circle"></i> Desplazamiento
          </button>
        </div>
      </div>

      <div class="modal-lyrics-body" id="modalLyricsText"></div>

      <div class="modal-footer-nav" id="modalFooterNav" style="display: flex;">
        <button class="modal-tool-btn" id="prevSongBtn" onclick="navigateMassSong(-1)">
          <i data-lucide="chevron-left"></i> Anterior
        </button>
        <span id="modalCounter" style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted);">1 / 11</span>
        <button class="modal-tool-btn" id="nextSongBtn" onclick="navigateMassSong(1)">
          Siguiente <i data-lucide="chevron-right"></i>
        </button>
      </div>
    </div>
  </div>

    let currentMassIndex = 0;

    document.addEventListener("DOMContentLoaded", () => {
      initLayout("evento-misa-2026", "Evento • Misa de Aguinaldo 2026");
      renderMassCards(misaAguinaldosData);
      renderFullMass(misaAguinaldosData);
    });

    function renderMassCards(list) {
      const container = document.getElementById("massSongsContainer");
      container.innerHTML = "";

      list.forEach(item => {
        const originalIndex = misaAguinaldosData.findIndex(s => s.orden === item.orden);
        const card = document.createElement("div");
        card.className = "song-card";
        card.onclick = () => openMassModal(originalIndex);

        card.innerHTML = `
          <div class="song-card-top">
            <span class="moment-badge">${item.orden}. ${item.momento}</span>
            <span class="tone-badge"><i data-lucide="music-4" style="width:14px;height:14px;"></i> ${item.tono}</span>
          </div>
          <div class="song-card-header">
            <h3 class="song-title">${item.titulo}</h3>
          </div>
          <p class="song-snippet">${item.letra}</p>
          <div class="song-btn-view">
            <i data-lucide="book-open" style="width: 16px; height: 16px;"></i> Ver Letra Completa
          </div>
        `;
        container.appendChild(card);
      });

      document.getElementById("massCountBadge").innerHTML = `<i data-lucide="list-music" style="width:14px;height:14px;"></i> ${list.length} Cantos`;
      lucide.createIcons();
    }

    function renderFullMass(list) {
      const container = document.getElementById("fullMassContainer");
      container.innerHTML = "";

      list.forEach(item => {
        const block = document.createElement("div");
        block.className = "mass-block-card";
        block.innerHTML = `
          <div class="mass-block-header">
            <div class="mass-block-title-group">
              <span class="mass-block-moment">${item.orden}. ${item.momento}</span>
              <h3 class="mass-block-title">${item.titulo}</h3>
            </div>
            <span class="tone-badge"><i data-lucide="music-4" style="width:14px;height:14px;"></i> Tono: ${item.tono}</span>
          </div>
          <div class="mass-block-lyrics">${item.letra}</div>
        `;
        container.appendChild(block);
      });
      lucide.createIcons();
    }

    function switchMassViewMode(mode) {
      const grid = document.getElementById("massSongsContainer");
      const full = document.getElementById("fullMassContainer");
      const btnGrid = document.getElementById("btnMassGridView");
      const btnList = document.getElementById("btnMassListView");

      if (mode === "grid") {
        grid.style.display = "grid";
        full.classList.remove("active");
        btnGrid.classList.add("active-mode");
        btnList.classList.remove("active-mode");
      } else {
        grid.style.display = "none";
        full.classList.add("active");
        btnList.classList.add("active-mode");
        btnGrid.classList.remove("active-mode");
      }
    }

    function filterMassSongs() {
      const query = document.getElementById("massSearchInput").value.toLowerCase();
      const filtered = misaAguinaldosData.filter(s => 
        s.momento.toLowerCase().includes(query) ||
        s.titulo.toLowerCase().includes(query) || 
        s.letra.toLowerCase().includes(query) ||
        s.tono.toLowerCase().includes(query)
      );
      renderMassCards(filtered);
      renderFullMass(filtered);
    }

    function openMassModal(index) {
      currentMassIndex = index;
      const item = misaAguinaldosData[index];

      document.getElementById("modalMoment").innerText = `Momento ${item.orden} • ${item.momento}`;
      document.getElementById("modalTitle").innerText = item.titulo;
      document.getElementById("modalToneBadge").innerHTML = `<i data-lucide="music-4" style="width:14px;height:14px;"></i> Tono: ${item.tono}`;
      
      const modalBody = document.getElementById("modalLyricsText");
      modalBody.style.whiteSpace = "pre-line";
      modalBody.textContent = item.letra;
      modalBody.style.fontSize = `${currentFontSize}rem`;
      modalBody.scrollTop = 0;

      document.getElementById("modalCounter").innerText = `${index + 1} / ${misaAguinaldosData.length}`;
      document.getElementById("prevSongBtn").disabled = index === 0;
      document.getElementById("nextSongBtn").disabled = index === misaAguinaldosData.length - 1;

      stopAutoScroll();
      document.getElementById("lyricsModal").classList.add("open");
      lucide.createIcons();
    }

    function navigateMassSong(step) {
      const nextIndex = currentMassIndex + step;
      if (nextIndex >= 0 && nextIndex < misaAguinaldosData.length) {
        openMassModal(nextIndex);
      }
    }
  </script>
</body>
</html>
