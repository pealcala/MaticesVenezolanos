<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grupo Matices Venezolanos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header id="appHeader"></header>

  <div class="app-container">
    <aside id="sidebar"></aside>

    <main class="content-panel" id="mainPanel">
      <div class="default-hero-view">
        <div class="default-logo-wrapper">
          <img id="heroLogo" alt="Logo Matices Venezolanos" class="default-hero-logo">
        </div>
        <h2 class="default-hero-title">Matices Venezolanos</h2>
        <p class="default-hero-prompt">
          Llevando la esencia, raíz y emoción de nuestra tierra a cada rincón. Selecciona una sección en el menú lateral para explorar el repertorio, historia y ensamble.
        </p>
        <div class="hero-quick-actions">
          <a href="repertorio.html" class="quick-pill">
            <i data-lucide="music"></i> Ver Repertorio
          </a>
          <a href="eventos/misa-aguinaldo-2026.html" class="quick-pill">
            <i data-lucide="church"></i> Misa de Aguinaldo 2026
          </a>
          <a href="integrantes.html" class="quick-pill">
            <i data-lucide="users-2"></i> Conocer Integrantes
          </a>
          <a href="sobre-nosotros.html" class="quick-pill">
            <i data-lucide="book-open"></i> Nuestra Historia
          </a>
        </div>
      </div>
    </main>
  </div>

  <script src="js/layout.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      initLayout("inicio", "Repertorio Musical");
    });
  </script>
</body>
</html>
